<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CONTROLIA BMS | Demo</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#e5edf8;background:#0b1220}aside{background:#111c2e;padding:24px;width:240px;position:fixed;inset:0 auto 0 0;overflow:auto}h2{letter-spacing:2px;margin:0;color:#69baff}small{color:#a3b5cb}nav{margin-top:32px}button{font:inherit;cursor:pointer}nav button{display:block;width:100%;text-align:left;border:0;background:none;color:#b8c9df;padding:13px;border-radius:8px;margin:4px 0}nav button.active,nav button:hover{background:#203b5c;color:white}main{margin-left:240px;padding:30px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid #29384c;padding-bottom:18px}select{background:#17253a;color:white;padding:10px;border:1px solid #344762;border-radius:8px}h1{font-size:29px;margin:26px 0 8px}.notice{color:#f5ce83;font-size:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin:24px 0}.panel,.card{background:#131f31;border:1px solid #29384c;border-radius:12px;padding:20px}.card strong{display:block;font-size:30px;margin-top:12px}.green{color:#50d6a2}.amber{color:#f5ce83}.red{color:#ff9292}.panel{margin-bottom:18px;overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #29384c}th{color:#9eb1c9;font-size:12px}svg{width:100%;height:auto;max-height:210px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}footer{color:#8fa4bf;font-size:12px;margin-top:20px}@media(max-width:760px){aside{position:static;width:auto;padding:16px}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap;width:auto}main{margin:0;padding:16px}.grid{grid-template-columns:1fr}}
.hero{position:relative;min-height:218px;border-radius:14px;overflow:hidden;background:#233e55;border:1px solid #344762;margin-top:18px;display:flex;align-items:flex-end;padding:25px;isolation:isolate}.hero svg{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;z-index:-2}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0b1728 0%,#0b1728c9 32%,#0b17281a 90%);z-index:-1}.hero h2{color:white;letter-spacing:0;font-size:29px;margin:8px 0}.hero small{color:#c6d6e5}.hero .tag{display:inline-block;background:#142a3c;border:1px solid #55758d;border-radius:5px;padding:5px 9px;font-size:11px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px}.sectionhead h3{margin:0;font-size:16px}.systemgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.system{background:#131f31;border:1px solid #29384c;color:#e5edf8;border-radius:10px;text-align:left;padding:15px;display:grid;gap:8px}.system:hover{border-color:#69baff}.system .symbol{color:#79b9f5;font-size:24px}.system strong{font-size:16px}.card{border-top:2px solid #345f87}.card small{font-size:12px}.alarm{border-left:3px solid #f5ce83}.hero .imagecaption{position:absolute;bottom:10px;right:12px;font-size:10px;color:#e5edf8}nav button:before{content:attr(data-icon);display:inline-block;width:25px;color:#8ab8e8}nav button.active{box-shadow:inset 3px 0 #60a5fa} @media(max-width:760px){.hero{min-height:190px;padding:18px}.hero h2{font-size:23px}.hero .imagecaption{position:static;display:block;margin-top:8px}.hero svg{opacity:.7}}
.hero .sitephoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}.hero:after{z-index:0;pointer-events:none}.hero>div{position:relative;z-index:1}.photoform{display:grid;gap:12px;max-width:680px}.photoform input{font:inherit;color:inherit;background:#0b1220;border:1px solid #344762;border-radius:7px;padding:10px;width:100%}.photoform button,.photoedit{background:#203b5c;color:white;border:1px solid #55758d;padding:9px 14px;border-radius:7px}.photoedit{position:absolute;right:12px;top:12px;z-index:2}.photoform img{width:100%;max-height:220px;object-fit:cover;border-radius:8px}</style><aside><h2>CONTROLIA</h2><small>BUILDING MANAGEMENT SYSTEM</small><nav id="nav"></nav></aside><main><header><div>Supermercado piloto <small> / Operaciones</small></div><select aria-label="Localidad"><option>Localidad de demostración</option></select></header><h1 id="title"></h1><div class="notice">DEMO VISUAL · Datos simulados · Sin conexión a equipos reales</div><div id="content"></div><footer>CONTROLIA BMS · Prototipo visual independiente del sistema operativo</footer></main><script>
const equipment=[['Cuarto frío 01','-18.4 °C','-18 °C','Normal'],['Exhibidor carnes','2.1 °C','2 °C','Normal'],['Congelador helados','-14.2 °C','-20 °C','Alarma'],['Cuarto vegetales','4.3 °C','4 °C','Normal']];
const menus=['Dashboard','Refrigeración','Climatización','Dispositivos','Alarmas','Históricos','Integraciones','Mantenimiento','Empresas y localidades'];
const table=(headers,rows)=>'<div class="panel"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
const cards=items=>'<div class="cards">'+items.map(([a,b,c])=>'<div class="card"><small>'+a+'</small><strong class="'+(c||'')+'">'+b+'</strong></div>').join('')+'</div>';
const chart='<div class="panel"><h3>Temperatura · últimas 24 horas</h3><svg viewBox="0 0 600 180" role="img" aria-label="Tendencia simulada de temperatura"><g stroke="#344762"><path d="M45 20H580 M45 60H580 M45 100H580 M45 140H580"/></g><g fill="#a3b5cb" font-size="11"><text x="0" y="24">-10°</text><text x="0" y="64">-15°</text><text x="0" y="104">-20°</text><text x="0" y="144">-25°</text><text x="45" y="165">00:00</text><text x="280" y="165">12:00</text><text x="535" y="165">24:00</text></g><path d="M45 85L90 89 135 81 180 93 225 88 270 91 315 85 360 94 405 88 450 90 495 84 540 92 580 86" fill="none" stroke="#56b4ff" stroke-width="3"/><path d="M45 100H580" stroke="#50d6a2" stroke-dasharray="5 5"/></svg><small>Azul: medición simulada · Verde: referencia</small></div>';
const eq=()=>table(['Equipo','Temperatura','Consigna','Estado'],equipment);
const defaultPhoto='https://images.unsplash.com/photo-1578916171728-46686eac8d58?auto=format&fit=crop&w=1600&q=85';
let photo=defaultPhoto;try{photo=localStorage.getItem('controlia.demo.site.photo')||defaultPhoto}catch{}
function savePhoto(value){try{localStorage.setItem('controlia.demo.site.photo',value);photo=value;show('Dashboard')}catch(e){document.getElementById('photoStatus').textContent='No se pudo guardar. Usa una imagen más pequeña o una URL.'}}
function photoSettings(){document.getElementById('title').textContent='Configuración de localidad';document.getElementById('content').innerHTML='<div class="panel photoform"><h3>Imagen de la localidad</h3><small>Supermercado piloto · Preferencia guardada en este navegador</small><img id="photoPreview" alt="Vista previa de la localidad"><label for="photoUrl">URL HTTPS de la imagen</label><input id="photoUrl" type="url" placeholder="https://..."><button id="saveUrl">Guardar URL</button><label for="photoFile">O cargar fotografía (JPG, PNG o WebP, máximo 2 MB)</label><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp"><button id="resetPhoto">Restaurar imagen de referencia</button><small id="photoStatus" role="status"></small></div>';document.getElementById('photoPreview').src=photo;document.getElementById('saveUrl').onclick=()=>{let u;try{u=new URL(document.getElementById('photoUrl').value);if(u.protocol!=='https:')throw Error()}catch{document.getElementById('photoStatus').textContent='Introduce una URL HTTPS válida.';return}const img=new Image();img.onload=()=>savePhoto(u.href);img.onerror=()=>document.getElementById('photoStatus').textContent='No se pudo cargar la imagen.';img.src=u.href};document.getElementById('photoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>2097152){document.getElementById('photoStatus').textContent='Formato no permitido o archivo mayor de 2 MB.';return}const reader=new FileReader();reader.onload=()=>savePhoto(reader.result);reader.readAsDataURL(f)};document.getElementById('resetPhoto').onclick=()=>savePhoto(defaultPhoto)}
function show(m){document.getElementById('title').textContent=m;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.textContent===m));let h='';
switch(m){case 'Dashboard':h="<div class=\"hero\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1000 340\"><defs><linearGradient id=\"sky\" x2=\"0\" y2=\"1\"><stop stop-color=\"#315575\"/><stop offset=\"1\" stop-color=\"#9ab7c5\"/></linearGradient><linearGradient id=\"glass\" x2=\"1\" y2=\"1\"><stop stop-color=\"#17394c\"/><stop offset=\"1\" stop-color=\"#6a9fb1\"/></linearGradient></defs><path fill=\"url(#sky)\" d=\"M0 0H1000V340H0Z\"/><path fill=\"#627b86\" d=\"M0 238L1000 210V340H0Z\"/><path fill=\"#c3d0d4\" d=\"M245 100L815 55 980 125 405 175Z\"/><path fill=\"#a4b7c2\" d=\"M245 100L405 175V280L245 204Z\"/><path fill=\"#dce4e6\" d=\"M405 175L980 125V244L405 280Z\"/><path fill=\"#233f55\" d=\"M405 175L980 125V150L405 201Z\"/><path fill=\"url(#glass)\" d=\"M425 210L960 166V230L425 266Z\"/><g stroke=\"#a9c3ce\" stroke-width=\"4\"><path d=\"M440 208v55\"/><path d=\"M485 204.3v55\"/><path d=\"M530 200.6v55\"/><path d=\"M575 196.9v55\"/><path d=\"M620 193.2v55\"/><path d=\"M665 189.5v55\"/><path d=\"M710 185.8v55\"/><path d=\"M755 182.1v55\"/><path d=\"M800 178.4v55\"/><path d=\"M845 174.7v55\"/><path d=\"M890 171v55\"/><path d=\"M935 167.3v55\"/></g><path fill=\"#1c364a\" d=\"M630 190L752 180V253L630 261Z\"/><path fill=\"#e7eff2\" d=\"M620 180L760 168V182L620 194Z\"/><g stroke=\"#dce5e8\" stroke-width=\"3\" opacity=\".65\"><path d=\"M420 310L520 281M550 310L650 275M680 310L780 267M810 310L910 259\"/></g><g fill=\"#315e50\"><circle cx=\"920\" cy=\"95\" r=\"26\"/><circle cx=\"970\" cy=\"86\" r=\"30\"/></g></svg><div><span class=\"tag\">LOCALIDAD · DEMOSTRACIÓN</span><h2>Supermercado piloto</h2><small>República Dominicana · Supervisión de instalaciones</small><p class=\"amber\">● 1 alarma activa · Datos simulados</p><span class=\"imagecaption\">Imagen de referencia · Personalizable</span></div></div>"+cards([['Equipos en línea','4 / 4','green'],['Alarmas activas','1','amber'],['Localidades','1'],['Temperatura fuera de rango','1','red']])+'<div class="sectionhead"><h3>Estado de los sistemas</h3><small>Vista de operación</small></div><div class="systemgrid"><button class="system" onclick="show(\'Refrigeración\')"><span class="symbol">❄</span><strong>Refrigeración</strong><small class="amber">● 1 alarma · 4 equipos</small></button><button class="system" onclick="show(\'Climatización\')"><span class="symbol">≋</span><strong>Climatización</strong><small class="green">● Normal · 2 zonas</small></button><button class="system" onclick="show(\'Dispositivos\')"><span class="symbol">▣</span><strong>Dispositivos</strong><small>Consultar inventario</small></button><button class="system" onclick="show(\'Mantenimiento\')"><span class="symbol">⚙</span><strong>Mantenimiento</strong><small>Consultar horas de uso</small></button></div><div class="sectionhead"><h3>Supervisión térmica</h3><small>Últimas 24 horas</small></div><div class="grid">'+chart+'<div class="panel alarm"><h3>Alarma prioritaria</h3><p class="amber">Congelador helados</p><p>-14.2 °C · Temperatura elevada</p><small>Ejemplo simulado</small></div></div>'+eq();break;
case 'Refrigeración':h=cards([['Equipos','4'],['En rango','3','green'],['Fuera de rango','1','red']])+eq()+chart;break;
case 'Climatización':h=table(['Zona','Temperatura','Consigna','Estado'],[['Sala de ventas','24.1 °C','24 °C','Normal'],['Oficinas','23.2 °C','23 °C','Normal']]);break;
case 'Dispositivos':h=table(['Dispositivo','Protocolo','Estado'],[['Termostato ARIME','Modbus TCP','Ejemplo'],['Shelly Pro 4PM','Shelly LAN','Ejemplo'],['Sensor puerta','Home Assistant','Ejemplo']]);break;
case 'Alarmas':h=table(['Prioridad','Equipo','Descripción','Estado'],[['Alta','Congelador helados','Temperatura elevada','Activa (simulada)']]);break;
case 'Históricos':h=chart+eq();break;
case 'Integraciones':h=table(['Integración','Configuración de ejemplo'],[['Home Assistant','IP / puerto / token / entidad'],['Modbus TCP / RTU','IP / puerto / ID / perfil'],['Shelly LAN / Cloud','IP o credencial'],['Tasmota IR','IP / perfil'],['Zigbee2MQTT','Broker / dispositivo'],['BACnet','Dirección / objeto']]);break;
case 'Mantenimiento':h=table(['Equipo','Horas de uso','Próximo servicio'],[['Compresor 01','420 h','500 h'],['Ventilador 02','180 h','250 h']]);break;
default:h=table(['Empresa','Localidad','Estado'],[['Supermercado piloto','Localidad de demostración','Ejemplo']]);}document.getElementById('content').innerHTML=h;if(m==='Dashboard'){const hero=document.querySelector('.hero');const img=document.createElement('img');img.className='sitephoto';img.alt='Imagen de la localidad';img.onerror=()=>img.remove();img.src=photo;hero.prepend(img);const b=document.createElement('button');b.className='photoedit';b.textContent='⚙ Cambiar imagen';b.onclick=photoSettings;hero.append(b)}else if(m==='Empresas y localidades'){const b=document.createElement('button');b.className='photoedit';b.style.position='static';b.textContent='Configurar imagen de localidad';b.onclick=photoSettings;document.getElementById('content').append(b)}}
menus.forEach((m,i)=>{const b=document.createElement('button');b.textContent=m;b.dataset.icon=['▦','❄','≋','▣','△','↗','⇄','⚙','▤'][i];b.onclick=()=>show(m);document.getElementById('nav').append(b)});show('Dashboard');
</script></html>
